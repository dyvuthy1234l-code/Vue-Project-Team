<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3728"/>
      <stop offset="50%" stop-color="#342318"/>
      <stop offset="100%" stop-color="#1f140e"/>
    </linearGradient>
    
    <!-- Red Leather Cover Gradient -->
    <linearGradient id="leatherCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e1920"/>
      <stop offset="25%" stop-color="#841117"/>
      <stop offset="70%" stop-color="#690a0f"/>
      <stop offset="100%" stop-color="#4c060a"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cd"/>
      <stop offset="20%" stop-color="#f3d06f"/>
      <stop offset="45%" stop-color="#d49b28"/>
      <stop offset="70%" stop-color="#fce893"/>
      <stop offset="90%" stop-color="#b88118"/>
      <stop offset="100%" stop-color="#ffd56b"/>
    </linearGradient>

    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="20%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="bookShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="15" dy="25" stdDeviation="20" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    
    <!-- Emboss Filter -->
    <filter id="goldEmboss">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#3a0407" flood-opacity="0.9"/>
    </filter>
  </defs>

  <style>
    .khmer-font { font-family: 'Kantumruy Pro', 'Hanuman', 'Khmer OS Siemreap', 'Moul', sans-serif; }
    .gold-text { fill: url(#goldFoil); filter: url(#goldEmboss); font-weight: bold; }
    .gold-stroke { stroke: url(#goldFoil); fill: none; }
  </style>

  <!-- Office Desk Surface -->
  <rect width="1200" height="675" fill="url(#deskGrad)"/>
  
  <!-- Desk elements for realism (pen and notebook hint) -->
  <circle cx="1120" cy="180" r="140" fill="#2d1c13" opacity="0.4"/>
  <rect x="940" y="80" width="180" height="260" rx="6" fill="#fff" opacity="0.07" transform="rotate(15 1030 210)"/>

  <!-- Family Book Object (Rotated slightly for natural look) -->
  <g transform="translate(380, 50) rotate(2)" filter="url(#bookShadow)">
    
    <!-- Booklet Pages Edge (3D effect) -->
    <rect x="18" y="10" width="440" height="565" rx="8" fill="#e8dcc4"/>
    <rect x="15" y="8" width="440" height="565" rx="8" fill="#f4ebd9"/>
    
    <!-- Book Front Cover -->
    <rect x="0" y="0" width="450" height="570" rx="10" fill="url(#leatherCover)"/>

    <!-- Leather texture overlay lines -->
    <rect x="0" y="0" width="450" height="570" rx="10" fill="none" stroke="#fff" stroke-opacity="0.04" stroke-width="1.5"/>

    <!-- Spine groove line -->
    <line x1="32" y1="0" x2="32" y2="570" stroke="#330205" stroke-width="3.5"/>
    <line x1="35" y1="0" x2="35" y2="570" stroke="url(#goldFoil)" stroke-width="0.8" opacity="0.6"/>
    <rect x="0" y="0" width="32" height="570" fill="url(#spineShadow)"/>

    <!-- Double Ornamental Gold Border -->
    <rect x="52" y="30" width="365" height="510" rx="6" class="gold-stroke" stroke-width="2.5"/>
    <rect x="58" y="36" width="353" height="498" rx="4" class="gold-stroke" stroke-width="1" stroke-dasharray="8 4"/>

    <!-- Khmer Royal Coat of Arms / Emblem (Embossed Gold) -->
    <g transform="translate(235, 180) scale(0.9)">
      <!-- Royal Crown / Monogram Shape -->
      <path d="M-35,30 C-35,10 -15,-30 0,-45 C15,-30 35,10 35,30 C20,38 -20,38 -35,30 Z" fill="url(#goldFoil)" filter="url(#goldEmboss)"/>
      <circle cx="0" cy="-52" r="5" fill="url(#goldFoil)"/>
      <!-- Sword and Tray -->
      <path d="M-45,25 L45,25 L35,38 L-35,38 Z" fill="url(#goldFoil)"/>
      <!-- Flanking Mythical Lions/Creatures -->
      <path d="M-60,35 C-75,15 -65,-10 -50,-20 C-55,-5 -45,10 -40,25 Z" fill="url(#goldFoil)"/>
      <path d="M60,35 C75,15 65,-10 50,-20 C55,-5 45,10 40,25 Z" fill="url(#goldFoil)"/>
      <!-- Rays/Aura -->
      <circle cx="0" cy="5" r="28" fill="none" stroke="url(#goldFoil)" stroke-width="2" stroke-dasharray="3 3"/>
    </g>

    <!-- Official Header Khmer Script -->
    <text x="235" y="80" text-anchor="middle" class="khmer-font gold-text" font-size="20" letter-spacing="1">ព្រះរាជាណាចក្រកម្ពុជា</text>
    <text x="235" y="106" text-anchor="middle" class="khmer-font gold-text" font-size="14" letter-spacing="0.5">ជាតិ សាសនា ព្រះមហាក្សត្រ</text>

    <!-- National Motto decorative flourish -->
    <path d="M165,116 Q235,122 305,116" fill="none" stroke="url(#goldFoil)" stroke-width="1.2"/>
    <circle cx="235" cy="119" r="2.5" fill="url(#goldFoil)"/>

    <!-- Ministry & Department -->
    <text x="235" y="270" text-anchor="middle" class="khmer-font gold-text" font-size="14" opacity="0.95">ក្រសួងមហាផ្ទៃ</text>
    <text x="235" y="292" text-anchor="middle" class="khmer-font gold-text" font-size="12" opacity="0.85">អគ្គនាយកដ្ឋានអត្តសញ្ញាណកម្ម</text>

    <!-- Main Title: សៀវភៅគ្រួសារ -->
    <text x="235" y="360" text-anchor="middle" class="khmer-font gold-text" font-size="34" font-weight="900" letter-spacing="2">សៀវភៅគ្រួសារ</text>
    <text x="235" y="400" text-anchor="middle" class="khmer-font gold-text" font-size="20" font-weight="bold">( ក.ប.៤ )</text>
    <text x="235" y="425" text-anchor="middle" class="gold-text" font-size="13" letter-spacing="3">FAMILY RECORD BOOK</text>

    <!-- Decorative Bottom Motif -->
    <g transform="translate(235, 480)">
      <path d="M-60,0 Q0,-10 60,0 Q0,10 -60,0" fill="url(#goldFoil)"/>
      <circle cx="0" cy="0" r="4" fill="url(#goldFoil)"/>
    </g>
  </g>

  <!-- Side Badge / Tag for UI Clarity -->
  <g transform="translate(60, 240)">
    <rect width="260" height="190" rx="14" fill="#0f172a" fill-opacity="0.88" stroke="#334155" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="#dc2626" fill-opacity="0.2"/>
    <path d="M45,35 L45,55 M35,45 L55,45" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <text x="78" y="42" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">សៀវភៅគ្រួសារ ក.ប.៤</text>
    <text x="78" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12">Cambodian Family Book</text>
    
    <line x1="25" y1="85" x2="235" y2="85" stroke="#334155" stroke-width="1"/>
    
    <text x="30" y="112" fill="#cbd5e1" font-family="'Kantumruy Pro', sans-serif" font-size="13">✓ ឯកសារច្បាប់ដើមក្បាលក្រហម</text>
    <text x="30" y="138" fill="#cbd5e1" font-family="'Kantumruy Pro', sans-serif" font-size="13">✓ បញ្ជាក់ញាតិភាពគ្រួសារខ្មែរ</text>
    <text x="30" y="164" fill="#cbd5e1" font-family="'Kantumruy Pro', sans-serif" font-size="13">✓ ចេញដោយអធិការដ្ឋាននគរបាល</text>
  </g>
</svg>
