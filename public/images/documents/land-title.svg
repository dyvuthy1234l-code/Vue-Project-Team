<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="landDeskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2720"/>
      <stop offset="50%" stop-color="#1c1813"/>
      <stop offset="100%" stop-color="#0e0c0a"/>
    </linearGradient>

    <!-- Warm Parchment / Hard Title paper color -->
    <linearGradient id="hardTitlePaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffef6"/>
      <stop offset="50%" stop-color="#fdfae8"/>
      <stop offset="100%" stop-color="#f8f2d5"/>
    </linearGradient>

    <linearGradient id="garudaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <filter id="landShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="8" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <pattern id="landSecurityPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0 L20,10 L10,20 Z" fill="none" stroke="#d97706" stroke-opacity="0.06" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .khmer-moul { font-family: 'Moul', 'Kantumruy Pro', sans-serif; }
    .khmer-body { font-family: 'Kantumruy Pro', 'Hanuman', 'Khmer OS Siemreap', sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#landDeskBg)"/>
  <ellipse cx="600" cy="300" rx="550" ry="300" fill="#d97706" opacity="0.03"/>

  <!-- Land Title Hard Document -->
  <g transform="translate(360, 30)" filter="url(#landShadow)">
    <rect width="480" height="615" rx="4" fill="url(#hardTitlePaper)"/>
    <rect width="480" height="615" rx="4" fill="url(#landSecurityPattern)"/>

    <!-- Double Border Frame in Classic Gold/Dark Green -->
    <rect x="16" y="16" width="448" height="583" rx="2" fill="none" stroke="#92400e" stroke-width="2.5"/>
    <rect x="22" y="22" width="436" height="571" rx="2" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="8 4"/>

    <!-- Garuda (គ្រុឌ) Emblem - Iconic Cambodian Land Title Symbol -->
    <g transform="translate(240, 58) scale(0.85)">
      <!-- Garuda Wings -->
      <path d="M-35,5 C-45,-15 -25,-25 0,-15 C25,-25 45,-15 35,5 C20,15 -20,15 -35,5 Z" fill="url(#garudaGold)"/>
      <!-- Body & Crown -->
      <path d="M-10,-5 L0,-32 L10,-5 L0,22 Z" fill="url(#garudaGold)"/>
      <circle cx="0" cy="-35" r="3.5" fill="#fef3c7"/>
      <!-- Claws/Legs -->
      <path d="M-18,18 L-8,30 L0,20 L8,30 L18,18" fill="none" stroke="url(#garudaGold)" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Header Text -->
    <text x="240" y="104" text-anchor="middle" class="khmer-moul" font-size="13.5" fill="#78350f">ព្រះរាជាណាចក្រកម្ពុជា</text>
    <text x="240" y="122" text-anchor="middle" class="khmer-body" font-size="10.5" fill="#78350f">ជាតិ សាសនា ព្រះមហាក្សត្រ</text>
    <path d="M190,127 Q240,131 290,127" fill="none" stroke="#78350f" stroke-width="1"/>

    <!-- Ministry Name -->
    <text x="240" y="146" text-anchor="middle" class="khmer-body" font-size="10" font-weight="bold" fill="#1e293b">ក្រសួងរៀបចំដែនដី នគរូបនីយកម្ម និងសំណង់</text>
    <text x="240" y="160" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">MINISTRY OF LAND MANAGEMENT, URBAN PLANNING AND CONSTRUCTION</text>

    <!-- Main Title: វិញ្ញាបនបត្រសម្គាល់ម្ចាស់អចលនវត្ថុ -->
    <rect x="50" y="174" width="380" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="240" y="195" text-anchor="middle" class="khmer-moul" font-size="14" fill="#92400e">វិញ្ញាបនបត្រសម្គាល់ម្ចាស់អចលនវត្ថុ</text>
    <text x="240" y="207" text-anchor="middle" class="khmer-body" font-size="9" fill="#b45309" font-weight="bold">( ប្លង់រឹង - Hard Title Deed )</text>

    <!-- Property Details Form -->
    <g transform="translate(42, 226)" class="khmer-body" font-size="9.5" fill="#1e293b">
      <!-- Info Header line -->
      <text x="0" y="15" fill="#64748b">លេខប័ណ្ណ (Title ID): <tspan font-weight="bold" fill="#0f172a">12-08-04-0329</tspan></text>
      <text x="230" y="15" fill="#64748b">លេខក្បាលដី (Parcel): <tspan font-weight="bold" fill="#0f172a">លេខ ២៤៥</tspan></text>

      <text x="0" y="35" fill="#64748b">ទីតាំងដី: <tspan font-weight="bold" fill="#0f172a">ភូមិ៤ សង្កាត់បឹងកក់២ ខណ្ឌទួលគោក រាជធានីភ្នំពេញ</tspan></text>
      <text x="0" y="55" fill="#64748b">ទំហំដីសរុប (Surface): <tspan font-weight="bold" fill="#b45309">៣៦០ ម៉ែត្រការ៉េ (12m x 30m)</tspan></text>

      <!-- Cadastral Map Cadre (ដ្យាក្រាមក្បាលដី) -->
      <rect x="0" y="68" width="396" height="180" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="86" fill="#64748b" font-size="8.5">ដ្យាក្រាមក្បាលដី (Cadastral Parcel Map)</text>

      <!-- North Compass Arrow -->
      <g transform="translate(365, 105)">
        <polygon points="0,-18 5,0 -5,0" fill="#dc2626"/>
        <polygon points="0,18 5,0 -5,0" fill="#64748b"/>
        <text x="0" y="-22" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#dc2626">N</text>
      </g>

      <!-- Road line -->
      <rect x="40" y="100" width="280" height="18" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3 3"/>
      <text x="180" y="113" text-anchor="middle" font-size="8" fill="#64748b">ផ្លូវបេតុងទំហំ ៨ ម៉ែត្រ</text>

      <!-- Surrounding Parcels -->
      <rect x="40" y="125" width="65" height="95" fill="#fafafa" stroke="#cbd5e1"/>
      <text x="72" y="175" text-anchor="middle" font-size="8" fill="#94a3b8">ដីលេខ ២៤៤</text>

      <!-- Target Plot Highlighted -->
      <rect x="110" y="125" width="130" height="95" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="175" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">ក្បាលដី ២៤៥</text>
      <text x="175" y="178" text-anchor="middle" font-size="9" fill="#78350f">ទំហំ ៣៦០ ម²</text>
      <text x="175" y="196" text-anchor="middle" font-size="8" fill="#15803d">ម្ចាស់កម្មសិទ្ធិស្របច្បាប់</text>

      <rect x="245" y="125" width="75" height="95" fill="#fafafa" stroke="#cbd5e1"/>
      <text x="282" y="175" text-anchor="middle" font-size="8" fill="#94a3b8">ដីលេខ ២៤៦</text>
    </g>

    <!-- Bottom Registry Sign-off & Red Cadastral Seal -->
    <g transform="translate(42, 495)">
      <!-- Barcode / QR -->
      <rect x="10" y="8" width="60" height="60" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
      <rect x="14" y="12" width="16" height="16" fill="#0f172a"/>
      <rect x="50" y="12" width="16" height="16" fill="#0f172a"/>
      <rect x="14" y="48" width="16" height="16" fill="#0f172a"/>
      <rect x="34" y="32" width="12" height="12" fill="#0f172a"/>
      <text x="40" y="80" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#64748b">QR សុរិយោដី</text>

      <!-- Authority Sign -->
      <text x="285" y="16" text-anchor="middle" class="khmer-body" font-size="9" fill="#475569">រាជធានីភ្នំពេញ, ថ្ងៃទី ០៩ ខែ វិច្ឆិកា ឆ្នាំ ២០២៣</text>
      <text x="285" y="32" text-anchor="middle" class="khmer-body" font-size="9.5" font-weight="bold" fill="#0f172a">ប្រធានមន្ទីររៀបចំដែនដី នគរូបនីយកម្ម សំណង់ និងសុរិយោដី</text>

      <!-- Signature -->
      <path d="M245,65 Q270,35 295,65 Q315,48 345,68" fill="none" stroke="#1e3a8a" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Red Round Cadastral Stamp -->
      <g transform="translate(285, 60)" opacity="0.9">
        <circle cx="0" cy="0" r="42" fill="none" stroke="#dc2626" stroke-width="3"/>
        <circle cx="0" cy="0" r="37" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 2"/>
        <text y="-20" text-anchor="middle" class="khmer-body" font-size="6.5" fill="#dc2626" font-weight="bold">ក្រសួងរៀបចំដែនដី * កម្ពុជា</text>
        <text y="24" text-anchor="middle" class="khmer-body" font-size="6.5" fill="#dc2626" font-weight="bold">មន្ទីរសុរិយោដីរាជធានីភ្នំពេញ</text>
      </g>
    </g>
  </g>

  <!-- Side Badge -->
  <g transform="translate(60, 240)">
    <rect width="250" height="190" rx="14" fill="#0f172a" fill-opacity="0.88" stroke="#334155" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="#d97706" fill-opacity="0.2"/>
    <path d="M45,34 L57,43 L57,57 L33,57 L33,43 Z" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="78" y="42" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">ប្លង់រឹងដីធ្លីផ្លូវការ</text>
    <text x="78" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12">Hard Title Deed</text>
    
    <line x1="25" y1="85" x2="225" y2="85" stroke="#334155" stroke-width="1"/>
    
    <text x="30" y="112" fill="#cbd5e1" font-family="'Kantumruy Pro', sans-serif" font-size="13">✓ ប្លង់រឹងក្បាលគ្រុឌមាស</text>
    <text x="30" y="138" fill="#cbd5e1" font-family="'Kantumruy Pro', sans-serif" font-size="13">✓ មានដ្យាក្រាមក្បាលដីសុរិយោដី</text>
    <text x="30" y="164" fill="#cbd5e1" font-family="'Kantumruy Pro', sans-serif" font-size="13">✓ សុវត្ថិភាពខ្ពស់បំផុតលើកម្មសិទ្ធិ</text>
  </g>
</svg>
