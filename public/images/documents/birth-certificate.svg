<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Desk Wood Background -->
    <linearGradient id="deskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="50%" stop-color="#1e2b37"/>
      <stop offset="100%" stop-color="#111822"/>
    </linearGradient>

    <!-- Certificate Paper Texture Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfcf8"/>
      <stop offset="50%" stop-color="#f9f7ee"/>
      <stop offset="100%" stop-color="#f3efe0"/>
    </linearGradient>

    <!-- Certificate Shadow -->
    <filter id="certShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="8" dy="18" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Security Guilloche Pattern -->
    <pattern id="guilloche" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M0,15 Q7.5,0 15,15 T30,15 M15,0 Q22.5,15 30,0 T45,0" fill="none" stroke="#22734a" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <!-- Red Official Stamp Filter -->
    <filter id="stampBlur">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <style>
    .khmer-title { font-family: 'Moul', 'Kantumruy Pro', sans-serif; }
    .khmer-body { font-family: 'Kantumruy Pro', 'Hanuman', 'Khmer OS Siemreap', sans-serif; }
    .green-border { stroke: #1b633b; fill: none; }
    .gold-accent { fill: #c59734; }
  </style>

  <!-- Surface Background -->
  <rect width="1200" height="675" fill="url(#deskBg)"/>

  <!-- Subtle desk ambient light -->
  <ellipse cx="600" cy="300" rx="550" ry="300" fill="#38bdf8" opacity="0.04"/>

  <!-- Birth Certificate Document -->
  <g transform="translate(360, 30)" filter="url(#certShadow)">
    <!-- Paper Body -->
    <rect width="480" height="615" rx="4" fill="url(#paperGrad)"/>

    <!-- Guilloche Security Texture Overlay -->
    <rect width="480" height="615" rx="4" fill="url(#guilloche)"/>

    <!-- Outer Ornamental Green Guilloche Frame -->
    <rect x="18" y="18" width="444" height="579" rx="2" class="green-border" stroke-width="3"/>
    <rect x="24" y="24" width="432" height="567" rx="2" class="green-border" stroke-width="1.2" stroke-dasharray="6 3"/>

    <!-- Ornate Corner Motifs -->
    <g class="green-border" stroke-width="1.5">
      <path d="M24,40 L40,40 L40,24"/>
      <path d="M456,40 L440,40 L440,24"/>
      <path d="M24,575 L40,575 L40,591"/>
      <path d="M456,575 L440,575 L440,591"/>
    </g>

    <!-- Royal Emblem / Coat of Arms at top -->
    <g transform="translate(240, 62) scale(0.65)">
      <path d="M-25,20 C-25,5 -10,-20 0,-30 C10,-20 25,5 25,20 C15,25 -15,25 -25,20 Z" fill="#1b633b"/>
      <circle cx="0" cy="-35" r="4" fill="#c59734"/>
      <path d="M-30,18 L30,18 L25,26 L-25,26 Z" fill="#c59734"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#1b633b" stroke-width="1.5" stroke-dasharray="2 2"/>
    </g>

    <!-- Official Header -->
    <text x="240" y="106" text-anchor="middle" class="khmer-title" font-size="14" fill="#1b633b">ព្រះរាជាណាចក្រកម្ពុជា</text>
    <text x="240" y="124" text-anchor="middle" class="khmer-body" font-size="11" fill="#1b633b">ជាតិ សាសនា ព្រះមហាក្សត្រ</text>
    <path d="M185,130 Q240,135 295,130" fill="none" stroke="#1b633b" stroke-width="1"/>

    <!-- Sub-ministry -->
    <text x="45" y="152" class="khmer-body" font-size="10" fill="#334155" font-weight="bold">ក្រសួងមហាផ្ទៃ</text>
    <text x="45" y="167" class="khmer-body" font-size="9" fill="#64748b">រដ្ឋបាលរាជធានីភ្នំពេញ / សាលាសង្កាត់ទួលទំពូង</text>

    <text x="435" y="152" text-anchor="end" class="khmer-body" font-size="9" fill="#64748b">លេខសំបុត្រ: <tspan fill="#0f172a" font-weight="bold">១២០៤ / ២០២៣</tspan></text>

    <!-- Main Title -->
    <rect x="90" y="185" width="300" height="34" rx="4" fill="#e8f5e9" stroke="#1b633b" stroke-width="0.8"/>
    <text x="240" y="207" text-anchor="middle" class="khmer-title" font-size="17" fill="#1b633b" font-weight="bold">សំបុត្រកំណើត</text>
    <text x="240" y="232" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2e7d32" letter-spacing="3">ACTE DE NAISSANCE / BIRTH CERTIFICATE</text>

    <!-- Certificate Fields Table -->
    <g transform="translate(45, 255)" class="khmer-body" font-size="10.5" fill="#1e293b">
      <!-- Row 1: Name -->
      <text x="0" y="16" fill="#64748b">ឈ្មោះសាមីខ្លួន (Name):</text>
      <text x="145" y="16" font-weight="bold" fill="#0f172a">សុខ វិបុល (SOK VIBOL)</text>
      <line x1="140" y1="21" x2="390" y2="21" stroke="#cbd5e1" stroke-width="0.8"/>

      <!-- Row 2: Sex & DOB -->
      <text x="0" y="46" fill="#64748b">ភេទ (Sex):</text>
      <text x="60" y="46" font-weight="bold" fill="#0f172a">ប្រុស (M)</text>
      <text x="145" y="46" fill="#64748b">ថ្ងៃខែឆ្នាំកំណើត:</text>
      <text x="240" y="46" font-weight="bold" fill="#0f172a">១៥ ឧសភា ២០២៣</text>
      <line x1="55" y1="51" x2="135" y2="51" stroke="#cbd5e1" stroke-width="0.8"/>
      <line x1="235" y1="51" x2="390" y2="51" stroke="#cbd5e1" stroke-width="0.8"/>

      <!-- Row 3: Place of Birth -->
      <text x="0" y="76" fill="#64748b">ទីកន្លែងកំណើត:</text>
      <text x="120" y="76" font-weight="bold" fill="#0f172a">រាជធានីភ្នំពេញ ព្រះរាជាណាចក្រកម្ពុជា</text>
      <line x1="115" y1="81" x2="390" y2="81" stroke="#cbd5e1" stroke-width="0.8"/>

      <!-- Row 4: Father -->
      <text x="0" y="106" fill="#64748b">ឪពុកឈ្មោះ:</text>
      <text x="90" y="106" font-weight="bold" fill="#0f172a">សុខ ចិន្តា</text>
      <text x="210" y="106" fill="#64748b">សញ្ជាតិ:</text>
      <text x="260" y="106" font-weight="bold" fill="#0f172a">ខ្មែរ</text>
      <line x1="85" y1="111" x2="200" y2="111" stroke="#cbd5e1" stroke-width="0.8"/>
      <line x1="255" y1="111" x2="390" y2="111" stroke="#cbd5e1" stroke-width="0.8"/>

      <!-- Row 5: Mother -->
      <text x="0" y="136" fill="#64748b">ម្តាយឈ្មោះ:</text>
      <text x="90" y="136" font-weight="bold" fill="#0f172a">អ៊ុំ ចាន់នី</text>
      <text x="210" y="136" fill="#64748b">សញ្ជាតិ:</text>
      <text x="260" y="136" font-weight="bold" fill="#0f172a">ខ្មែរ</text>
      <line x1="85" y1="141" x2="200" y2="141" stroke="#cbd5e1" stroke-width="0.8"/>
      <line x1="255" y1="141" x2="390" y2="141" stroke="#cbd5e1" stroke-width="0.8"/>
    </g>

    <!-- Bottom Authority Section -->
    <g transform="translate(45, 430)">
      <!-- QR Verification -->
      <rect x="0" y="30" width="70" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
      <!-- QR pattern mock -->
      <rect x="6" y="36" width="18" height="18" fill="#1e293b"/>
      <rect x="9" y="39" width="12" height="12" fill="#fff"/>
      <rect x="12" y="42" width="6" height="6" fill="#1e293b"/>
      <rect x="46" y="36" width="18" height="18" fill="#1e293b"/>
      <rect x="49" y="39" width="12" height="12" fill="#fff"/>
      <rect x="52" y="42" width="6" height="6" fill="#1e293b"/>
      <rect x="6" y="76" width="18" height="18" fill="#1e293b"/>
      <rect x="9" y="79" width="12" height="12" fill="#fff"/>
      <rect x="12" y="82" width="6" height="6" fill="#1e293b"/>
      <rect x="30" y="55" width="8" height="8" fill="#1e293b"/>
      <text x="35" y="115" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#64748b">ស្កេនផ្ទៀងផ្ទាត់</text>

      <!-- Signature & Date -->
      <text x="310" y="20" text-anchor="middle" class="khmer-body" font-size="9.5" fill="#334155">ធ្វើនៅសង្កាត់ទួលទំពូង, ថ្ងៃទី ២០ ខែ ឧសភា ឆ្នាំ ២០២៣</text>
      <text x="310" y="38" text-anchor="middle" class="khmer-body" font-size="10.5" font-weight="bold" fill="#0f172a">មន្ត្រីអត្រានុកូលដ្ឋាន / ចៅសង្កាត់</text>

      <!-- Blue Signature Simulation -->
      <path d="M260,80 Q280,50 300,75 Q320,60 340,78 Q360,65 370,82" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Official Round Red Ink Commune Stamp -->
      <g transform="translate(310, 75)" filter="url(#stampBlur)" opacity="0.88">
        <circle cx="0" cy="0" r="46" fill="none" stroke="#dc2626" stroke-width="3"/>
        <circle cx="0" cy="0" r="41" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 2"/>
        <path d="M-5,-5 L0,-18 L5,-5 L18,-5 L8,3 L12,16 L0,8 L-12,16 L-8,3 L-18,-5 Z" fill="#dc2626" transform="scale(0.7)"/>
        <text y="-25" text-anchor="middle" class="khmer-body" font-size="7.5" fill="#dc2626" font-weight="bold">ក្រសួងមហាផ្ទៃ * កម្ពុជា</text>
        <text y="32" text-anchor="middle" class="khmer-body" font-size="7" fill="#dc2626" font-weight="bold">រដ្ឋបាលសង្កាត់ទួលទំពូង</text>
      </g>
    </g>
  </g>

  <!-- Side Information Card -->
  <g transform="translate(60, 240)">
    <rect width="250" height="190" rx="14" fill="#0f172a" fill-opacity="0.88" stroke="#334155" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="#16a34a" fill-opacity="0.2"/>
    <path d="M38,45 L43,50 L52,38" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="42" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">សំបុត្រកំណើតផ្លូវការ</text>
    <text x="78" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12">Birth Certificate</text>
    
    <line x1="25" y1="85" x2="225" y2="85" stroke="#334155" stroke-width="1"/>
    
    <text x="30" y="112" fill="#cbd5e1" font-family="'Kantumruy Pro', sans-serif" font-size="13">✓ ច្បាប់ដើមអត្រានុកូលដ្ឋាន</text>
    <text x="30" y="138" fill="#cbd5e1" font-family="'Kantumruy Pro', sans-serif" font-size="13">✓ មានត្រាក្រហមសង្កាត់/ឃុំ</text>
    <text x="30" y="164" fill="#cbd5e1" font-family="'Kantumruy Pro', sans-serif" font-size="13">✓ ចុះបញ្ជីដោយឥតគិតថ្លៃ</text>
  </g>
</svg>
